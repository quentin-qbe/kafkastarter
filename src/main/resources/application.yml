spring:
  application:
    name: ${APP_NAME:kafkastarter}
    version: ${APP_VERSION:1.0.0}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/kafkastarter}
    username: ${SPRING_DATASOURCE_USERNAME:kafkastarter}
    password: ${SPRING_DATASOURCE_PASSWORD:kafkastarter}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: ${SPRING_JPA_FORMAT_SQL:true}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: ${KAFKA_SPECIFIC_AVRO_READER:true}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    streams:
      application-id: ${KAFKA_STREAMS_APPLICATION_ID:product-catalog-aggregator-v1}
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      properties:
        auto.offset.reset: ${KAFKA_STREAMS_AUTO_OFFSET_RESET:earliest}
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        num.stream.threads: ${KAFKA_STREAMS_NUM_THREADS:1}
        replication.factor: ${KAFKA_STREAMS_REPLICATION_FACTOR:1}
        processing.guarantee: ${KAFKA_PROCESSING_GUARANTEE:exactly_once_v2}
server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/kafkastarter}

logging:
  level:
    org.apache.kafka.streams: ${SPRING_LOG_LEVEL_KAFKA_STREAMS:INFO}
    org.springframework.kafka: ${SPRING_LOG_LEVEL_SPRING_KAFKA:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true