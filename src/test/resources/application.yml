spring:
  application:
    name: ${APP_NAME:kafkastarter}
    version: ${APP_VERSION:1.0.0}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  kafka:
    consumer:
      properties:
        specific.avro.reader: ${KAFKA_SPECIFIC_AVRO_READER:true}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:mock://test}
    streams:
      application-id: kafkastarter-test
    listener:
      auto-startup: false